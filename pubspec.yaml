name: neuroscale_pro
description: NeuroScale Pro — AI Psychiatry Clinical System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.5
  path: ^1.8.3
  fl_chart: ^0.66.2
  share_plus: ^7.2.1
  uuid: ^4.2.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^10.0.0
  file_picker: ^11.0.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.0.0
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/models/en/
    - assets/models/ta/

